[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgmq-py"
version = "0.1.0"
description = "A PostgreSQL message queue library for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yarden Mintz" }
]
keywords = ["postgresql", "message-queue", "pgmq", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yardenmintz/pgmq-py"
Repository = "https://github.com/yardenmintz/pgmq-py"

[tool.hatch.build.targets.wheel]
packages = ["src/pgmq_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
files = "src"
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
